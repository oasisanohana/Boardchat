<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ด้านในกล่องรัก 💝</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .content-card {
            background-color: white;
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);
            overflow: hidden;
            border: 1px solid #ffe4e1;
        }
        .image-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #fff0f5;
            position: relative;
        }
        .love-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* จัดให้รูปภาพเต็มกล่องสวยงามพอดี */
        }
        .card-body {
            padding: 35px 30px;
            text-align: center;
        }
        h2 {
            color: #ff527b;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }
        .love-text {
            color: #555;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-line;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #ffa4c4;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #ff69b4;
        }
    </style>
</head>
<body>

    <div class="content-card">
        <!-- 📸 ส่วนแสดงรูปภาพ -->
        <div class="image-container">
            <!-- บี๋ตั้งชื่อไฟล์รูปในโค้ดว่า love.jpg เป็นภาษาอังกฤษเรียบร้อยค่ะ -->
            <img src="love.jpg" alt="รูปภาพของเรา" class="love-image">
        </div>
        
        <div class="card-body">
            <h2>ความในใจจากบี๋ซัง 💌</h2>
            
            <p class="love-text">
                ขอบคุณที่อยู่ข้างกันเสมอนะคะ 
                รักเธอที่สุดในโลกเลยยยย 
                ขอให้เรามีความสุขและยิ้มได้เยอะๆ ในทุกๆ วันนะ 
                งอนกันบ้างทะเลาะกันบ้างแต่ก็รักเหมือนเดิมนะบี๋! 🧸💖
            </p>
            
            <a href="index.html" class="back-link">🔒 ปิดกล่องรัก</a>
        </div>
    </div>

</body>
</html>
