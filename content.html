<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเนื้อหาและรูปภาพ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: white;
            max-width: 600px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-body {
            padding: 30px;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        p {
            color: #555;
            line-height: 1.8;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ส่วนแสดงรูปภาพ: อย่าลืมเปลี่ยนชื่อไฟล์รูปใน src ให้ตรงกับของคุณนะคะ -->
        <img src="picture.jpg" alt="รูปภาพประกอบเนื้อหา" class="card-image">
        
        <div class="card-body">
            <h2>นี่คือหน้าเนื้อหาหลัก</h2>
            <p>ยินดีด้วยค่ะ! คุณได้กดเข้ามาสู่หน้าเนื้อหาแล้ว ในหน้านี้คุณสามารถใส่รายละเอียด เรื่องราว หรือข้อมูลต่างๆ ที่คุณต้องการนำเสนอคู่กับรูปภาพด้านบนได้ตามใจชอบเลยค่ะ โครงสร้างนี้ถูกจัดวางให้จัดหน้าสวยงามและอ่านง่ายทั้งบนคอมพิวเตอร์และมือถือค่ะ</p>
            
            <!-- ปุ่มกดกลับหน้าแรก -->
            <a href="index.html" class="btn-back">← กลับไปหน้าแรก</a>
        </div>
    </div>

</body>
</html>
