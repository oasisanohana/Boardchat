<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรกของฉัน</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</h1>
        <p>นี่คือหน้าแรกของเว็บไซต์ที่สร้างขึ้นด้วย HTML แบบเรียบง่าย คุณสามารถคลิกปุ่มด้านล่างเพื่อเข้าไปดูรายละเอียดเนื้อหา พร้อมรูปภาพสวยๆ ได้เลยค่ะ</p>
        <!-- ปุ่มกดเพื่อเชื่อมโยงไปหน้าเนื้อหา -->
        <a href="content.html" class="btn">คลิกตรงนี้เพื่อดูเนื้อหา</a>
    </div>

</body>
</html>
