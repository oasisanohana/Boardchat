<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Anniversary ❤️</title>
    <!-- นำเข้า Tailwind CSS และฟอนต์น่ารักๆ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Itim', cursive; }
    </style>
</head>
<body class="bg-pink-50 text-gray-700 min-h-screen flex flex-col items-center justify-center p-6">

    <!-- 🌸 หัวข้อหลักกลางหน้าจอ -->
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-pink-600 drop-shadow-sm">Happy Anniversary ❤️</h1>
        <p class="text-xl text-gray-500 mt-2">เค้ามีความลับซ่อนอยู่ในกล่องพวกนี้ ลองกดเปิดดูสิคะ</p>
    </div>

    <!-- 📦 โซนกล่องของขวัญให้กด (Clickable Cards) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 w-full max-w-3xl px-4">
        
        <!-- กล่องที่ 1: เรื่องราวของเรา -->
        <button onclick="openModal('🏠 เรื่องราวของเรา', 'ขอบคุณที่อยู่ข้างกันและคอยเป็นความสุขให้กันเสมอนะคะ ยินดีด้วยกับอีกหนึ่งปีที่น่ารักของเรานะเธอ! ดีใจที่มีเธอในชีวิตที่สุดเลย', 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500')" 
                class="bg-white p-8 rounded-2xl shadow-md border-2 border-pink-200 hover:border-pink-400 hover:scale-105 transition transform text-center flex flex-col items-center justify-center space-y-3 cursor-pointer group">
            <span class="text-5xl group-hover:animate-bounce">🎁</span>
            <span class="text-xl font-bold text-pink-500">เปิดกล่องที่ 1</span>
            <span class="text-sm text-gray-400">เรื่องราวของเรา</span>
        </button>

        <!-- กล่องที่ 2: ความทรงจำดีๆ -->
        <button onclick="openModal('📸 ความทรงจำดีๆ', 'จำได้ไหมวันนั้นที่ไปเที่ยวด้วยกัน สนุกมากเลยเนอะ ลมเย็นๆ กับมือที่จับกันไว้ มันดีที่สุดในโลกเลยล่ะ อยากไปเที่ยวกับเธออีกบ่อยๆ เลย', 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=500')" 
                class="bg-white p-8 rounded-2xl shadow-md border-2 border-pink-200 hover:border-pink-400 hover:scale-105 transition transform text-center flex flex-col items-center justify-center space-y-3 cursor-pointer group">
            <span class="text-5xl group-hover:animate-bounce">💌</span>
            <span class="text-xl font-bold text-pink-500">เปิดกล่องที่ 2</span>
            <span class="text-sm text-gray-400">ความทรงจำของเรา</span>
        </button>

        <!-- กล่องที่ 3: จดหมายความในใจ (แบบไม่ใส่รูป โชว์เฉพาะข้อความหวานๆ) -->
        <button onclick="openModal('💖 ถึง...คนเก่งของเค้า', 'อยากบอกว่าขอบคุณมากๆ เลยนะสำหรับทุกอย่างที่ผ่านมา ขอบคุณที่เป็นทั้งแฟน เป็นเซฟโซนที่ดีที่สุดให้เค้าเสมอ เวลาที่เธอหัวเราะน่ะน่ารักที่สุดในโลกเลยรู้ไหม\n\nปีนี้และปีต่อๆ ไป ก็ขอให้เราจับมือกันแน่นๆ แบบนี้ เติบโตไปด้วยกันนะ เค้ารักเธอที่สุดในโลกเลยค่ะ! 🥰', '')" 
                class="bg-white p-8 rounded-2xl shadow-md border-2 border-pink-200 hover:border-pink-400 hover:scale-105 transition transform text-center flex flex-col items-center justify-center space-y-3 cursor-pointer group">
            <span class="text-5xl group-hover:animate-bounce">💝</span>
            <span class="text-xl font-bold text-pink-500">เปิดกล่องที่ 3</span>
            <span class="text-sm text-gray-400">จดหมายความในใจ</span>
        </button>

    </div>

    <!-- 🛍️ กล่องข้อความ Pop-up (Modal) ที่จะเด้งขึ้นมาเมื่อกด -->
    <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 hidden z-50 transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl transform transition-all p-6 relative">
            
            <!-- ปุ่มกากบาทสำหรับปิดกล่อง -->
            <button onclick="closeModal()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            
            <!-- หัวข้อในกล่องข้อความ -->
            <h3 id="modalTitle" class="text-2xl font-bold text-pink-600 text-center mb-4"></h3>
            
            <!-- โซนแสดงรูปภาพ (จะซ่อนอัติโนมัติถ้าไม่มีการใส่ลิงก์รูป) -->
            <div id="modalImgContainer" class="mb-4 hidden overflow-hidden rounded-xl max-h-52 shadow-inner">
                <img id="modalImg" src="" alt="Memory Image" class="w-full h-full object-cover">
            </div>
            
            <!-- โซนแสดงเนื้อหาข้อความ -->
            <p id="modalText" class="text-gray-600 text-center leading-relaxed whitespace-pre-line text-lg bg-pink-50 p-4 rounded-xl"></p>
            
            <!-- ปุ่มปิดด้านล่าง -->
            <div class="mt-6 text-center">
                <button onclick="closeModal()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-8 rounded-full shadow-md transition transform hover:scale-105">
                    ปิดกล่องความรัก 💖
                </button>
            </div>
        </div>
    </div>

    <!-- 🎵 ส่วนท้ายเว็บ -->
    <footer class="text-center mt-12 text-xs text-gray-400">
        Made with ❤️ for you
    </footer>

    <!-- 🛠️ JavaScript ควบคุมการเปิด-ปิดกล่องข้อความ Pop-up -->
    <script>
        function openModal(title, text, imgSrc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            
            const imgContainer = document.getElementById('modalImgContainer');
            const img = document.getElementById('modalImg');
            
            // เช็คว่ามีรูปส่งมาไหม ถ้ามีให้โชว์ ถ้าไม่มีให้ซ่อนกล่องรูป
            if (imgSrc) {
                img.src = imgSrc;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }
            
            // แสดง Pop-up
            document.getElementById('messageModal').classList.remove('hidden');
        }

        function closeModal() {
            // ซ่อน Pop-up
            document.getElementById('messageModal').classList.add('hidden');
        }
        
        // พิเศษ: ถ้าคลิกพื้นที่ว่างข้างนอกกล่อง Pop-up ก็จะปิดให้เองอัตโนมัติด้วยค่ะ
        window.onclick = function(event) {
            const modal = document.getElementById('messageModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
