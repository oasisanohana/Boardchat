<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล่องรักจากบี๋ 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2; /* พื้นหลังสีชมพูพาสเทล */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .love-box {
            background-color: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            max-width: 400px;
            width: 85%;
            border: 2px dashed #ffb6c1;
            transition: transform 0.3s ease;
        }
        .love-box:hover {
            transform: scale(1.03);
        }
        h1 {
            color: #ff527b;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #777;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .heart-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: heartbeat 1.2s infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .open-btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s ease;
        }
        .open-btn:hover {
            background-color: #ff409f;
            box-shadow: 0 7px 20px rgba(255, 105, 180, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="love-box">
        <div class="heart-icon">🎁💖</div>
        <h1>กล่องรักจากบี๋</h1>
        <p>มีบางอย่างอยากจะบอกอยู่ในนี้แหละ... ลองกดเปิดดูสิคะ</p>
        <!-- ปุ่มกดเพื่อเปิดกล่องเข้าไปดูหน้าสอง -->
        <a href="content.html" class="open-btn">กดเปิดกล่องรัก ✨</a>
    </div>

</body>
</html>
